name: weekly-token-pricing

on:
  schedule:
    # 06:44 UTC = 08:44 CEST (summer) / 07:44 CET (winter).
    # GitHub cron is UTC only and does not follow DST.
    # Deliberately off the top of the hour: :00 slots are the most congested on
    # GitHub's shared scheduler and get delayed (or dropped) far more often.
    - cron: "44 6 * * 1"   # every Monday 06:44 UTC = 08:44 CEST (summer) / 07:44 CET (winter)
  workflow_dispatch: {}     # allow manual run from the Actions tab

permissions:
  contents: write           # to commit regenerated files
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run weekly agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: python check.py

      - name: Commit changes if any
        run: |
          git config user.name  "pricing-agent"
          git config user.email "actions@github.com"
          git add models.json index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "weekly auto-update (Mon) $(date -u +%F)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
