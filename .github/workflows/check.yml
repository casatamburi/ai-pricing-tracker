name: weekly-token-pricing

on:
  schedule:
    # 06:44 UTC = 08:44 CEST (summer) / 07:44 CET (winter).
    # GitHub cron is UTC only and does not follow DST.
    # Deliberately off the top of the hour: :00 slots are the most congested on
    # GitHub's shared scheduler and get delayed (or dropped) far more often.
    - cron: "44 6 * * 1"   # every Monday 06:44 UTC = 08:44 CEST (summer) / 07:44 CET (winter)
  push:
    branches: [main]
    # Publish data edits immediately instead of waiting for the next Monday.
    # This path runs the deploy only — no API call, no email.
    paths:
      - models.json
      - index.html
      - logo.b64
      - render.py
      - .github/workflows/check.yml
  workflow_dispatch: {}     # manual run from the Actions tab (also runs the agent)

permissions:
  contents: write           # to commit regenerated files
  pages: write
  id-token: write

# Never let a scheduled run and a push-deploy fight over Pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The agent: two LLM passes + merge + email. Skipped on push, so pushing data
  # never costs an API call or sends mail.
  agent:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run weekly agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: python check.py

      - name: Commit changes if any
        run: |
          git config user.name  "pricing-agent"
          git config user.email "actions@github.com"
          git add models.json index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "weekly auto-update (Mon) $(date -u +%F)"
            git push
          fi

  # Build the artifact from whatever is on main now. Runs after the agent on a
  # scheduled/manual run, and on its own for a push.
  build:
    needs: [agent]
    if: always() && (needs.agent.result == 'success' || needs.agent.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main           # pick up the agent's own commit from this run

      - name: Sanity-check the data before publishing
        run: |
          python -c "import json; d=json.load(open('models.json',encoding='utf-8')); \
            assert d['models'], 'no models'; \
            print('ok:', len(d['models']), 'models')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
